name: Bug report
description: Report a defect or incorrect behavior
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Board/variant used (328P-LQFP32 / 328P-LQFP48 / 328D)
        2. Sketch or code snippet
        3. What happened
    validations:
      required: true
  - type: input
    id: core-version
    attributes:
      label: Core version
      description: Release tag or commit hash
  - type: input
    id: ide
    attributes:
      label: Arduino IDE / CLI version
  - type: textarea
    id: silicon
    attributes:
      label: Silicon
      description: Chip package/revision if known (matters - DOC-023/024/030 are package-specific)
