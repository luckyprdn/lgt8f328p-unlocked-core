name: Feature request
description: Suggest a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What you are trying to do and why the current core or library does not cover it
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core (boot, timers, Serial, ...)
        - LGT8Unlocked library
        - Examples / documentation
        - Tooling / CI / packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: silicon-note
    attributes:
      label: Silicon constraints
      description: Any known errata (DOC-xxx) this feature touches - see docs/datasheet-errata.md
